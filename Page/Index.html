<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
        }

        .row {
            display: flex;
        }

        .column {
            flex: 50%;
            padding: 10px;
        }
    </style>
</head>
<body>

<h2>Api Services</h2>
<br>
<br>

<div class="row">
    <div class="column" style="background-color:#aaa;">
        <label>Country: </label><input id="InpUserCountry">
        <br>
        <br>
        <label>User Name: </label><input id="InpUserNameSignIn">
        <br>
        <br>
        <label>Password: </label><input id="InpPasswordSignIn">
        <br>
        <br>
        <button id="BtnSignIn">SignIn</button>

    </div>
    <div class="column" style="background-color:#bbb;">

        <label>UserName: </label><input id="getUserName">
        <br>
        <br>
        <label>Token: </label><input id="getToken">
        <br>
        <br>
        <label>SKU: </label><input id="SKUget">
        <br>
        <br>

            <button id="BtnSearch">Search</button>
        </div>
    <div class="column" style="background-color:#ccc;">
            <label>UserName: </label><input id="fileUsername">
            <br>
            <br>
            <label>Token </label><input id="fileToken">
            <br>
            <br>
            <input id="file" type="file" onchange="sendFile(this)" >
        </div>
    <div class="column" style="background-color:#ddd;">
        <label>Username: </label><input id="usernamePut">
        <br>
        <br>
        <label>Token : </label> <input id="tokenPut" >
        <br>
        <br>
        <label>SKU: </label><input id="SKUput">
        <br>
        <br>
        <label>Name : </label> <input id="NamePut" >
        <br>
        <br>
        <label>Count : </label> <input id="CountPut" >
        <br>
        <br>
        <button id="BtnSend">put item</button>
    </div>

</div>
<div>
    <label id="LBLResult"></label>
</div>
<script >

    function sendFile(e)
    {
        let aut = {
            user:document.getElementById("fileUsername").value,
            token:document.getElementById("fileToken").value
        };
       // console.log(aut)
        let xhr = new XMLHttpRequest();

        let formData = new FormData();
        let file = e.files[0];

        formData.append("aut", JSON.stringify(aut));
        formData.append("file", file);

        xhr.onreadystatechange = state => {
            console.log(xhr.response);
            document.getElementById('LBLResult').innerHTML = xhr.response;
        } // err handling
       // xhr.timeout = 50000;
        xhr.open("POST", 'http://localhost:9999/bulk');
        xhr.send(formData);

    }
    document.getElementById("BtnSignIn").addEventListener("click", (e) => {
        let Country = document.getElementById("InpUserCountry");
        let User = document.getElementById("InpUserNameSignIn");
        let Pass = document.getElementById("InpPasswordSignIn");
        fetch('http://localhost:9999/signIn', {
            method: 'POST',
            headers: {
                "Content-Type": "application/json; charset=UTF-8",
            },
            body: JSON.stringify({
                "countryCode"   :Country.value,
                "username"   :User.value,
                "password"   :Pass.value,
            }),

        })
            .then(function (response){
                return response.text()
            })
            .then(function (data){
                console.log(data)
                document.getElementById('LBLResult').innerHTML = data;
            });
    })
    document.getElementById("BtnSearch").addEventListener("click", (e) => {
        fetch('http://localhost:9999/search', {
            method: 'POST',
            headers: {
                "Content-Type": "application/json; charset=UTF-8",
            },
            body: JSON.stringify({
                "username"  :document.getElementById("getUserName").value,
                "token" :document.getElementById("getToken").value,
                "sku"  :document.getElementById("SKUget").value,
            }),
        })
            .then(function (response){
                return response.text()
            })
            .then(function (data){
                console.log(data)
                document.getElementById('LBLResult').innerHTML = data;
            });
    })
    document.getElementById("BtnSend").addEventListener("click", (e) => {
        fetch('http://localhost:9999/put', {
            method: 'POST',
            headers: {
                "Content-Type": "application/json; charset=UTF-8",
            },

            body:
                JSON.stringify({
                    "username"   : document.getElementById("usernamePut").value,
                    "token"   : document.getElementById("tokenPut").value,
                    "sku"   : document.getElementById("SKUput").value,
                    "name"   : document.getElementById("NamePut").value,
                    "Count"   :parseInt(document.getElementById("CountPut").value),
                }),
        })
            .then(function (response){
                return response.text()
            })
            .then(function (data){
                console.log(data)
                document.getElementById('LBLResult').innerHTML = data;

            });
    })


</script>
</body>
</html>
